<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interrepto — Voice AI Agent</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">

    <!-- Top Header Bar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <div class="logo-circle">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 8v4l3 3"></path>
          </svg>
        </div>
        <span class="app-name">ChatGPT</span>
        <span class="model-chip" id="model-chip">Voice</span>
      </div>
      <div class="top-bar-right">
        <span class="audio-only-badge">
          <span class="live-dot"></span>
          Audio Only
        </span>
      </div>
    </header>

    <!-- Main Voice Area -->
    <main class="voice-stage">

      <!-- Central Orb -->
      <div class="orb-wrapper" id="orb-wrapper">
        <div class="orb-rings">
          <div class="ring r1"></div>
          <div class="ring r2"></div>
          <div class="ring r3"></div>
        </div>
        <div class="orb-core" id="orb-core">
          <canvas id="wave-canvas" width="300" height="300"></canvas>
        </div>
      </div>

      <!-- Status Text -->
      <div class="status-text" id="status-text">Tap the microphone to begin</div>

      <!-- Interruption Badge -->
      <div class="interrupt-badge" id="interrupt-badge">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
        Interrupted
      </div>

      <!-- User Speech Bubble -->
      <div class="user-bubble" id="user-bubble">
        <span class="bubble-label">You</span>
        <span class="bubble-text" id="bubble-text">...</span>
      </div>

    </main>

    <!-- Bottom Input Bar -->
    <footer class="bottom-bar">
      <div class="input-row">
        <div class="input-pill">
          <input
            type="text"
            id="text-input"
            placeholder="Message ChatGPT"
            autocomplete="off"
          />
          <button class="send-btn" id="send-btn" title="Send">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
          <button class="mic-btn" id="mic-btn" title="Start voice conversation">
            <div class="mic-ring"></div>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
              <line x1="12" y1="19" x2="12" y2="22"></line>
            </svg>
          </button>
        </div>
        <p class="footer-hint">AI responds in voice only &mdash; speak anytime to interrupt</p>
      </div>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
